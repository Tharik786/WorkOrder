spring.application.name=zan-workorder
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zan_workorder?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:workorder}
spring.datasource.password=${DB_PASSWORD:tharik}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
