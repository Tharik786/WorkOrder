name: Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend
        run: mvn -f backend/pom.xml clean package -DskipTests
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
