services:
  mysql:
    image: mysql:8.4
    container_name: zan-workorder-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: zan_workorder
      MYSQL_USER: tharik
      MYSQL_PASSWORD: Tharik@123
      MYSQL_ROOT_PASSWORD: Tharik@123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-pTharik@123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: zan-workorder-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/zan_workorder?useSSL=false&serverTimezone=UTC}
      DB_USER: tharik
      DB_PASSWORD: Tharik@123
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    image: nginx:alpine
    container_name: zan-workorder-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: zan-workorder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mysql_data:
