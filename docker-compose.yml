services:
  mysql:
    image: mysql:8.4
    container_name: zan-workorder-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: configpage
      MYSQL_USER: zanprduser
      MYSQL_PASSWORD: Insp!ron154
      MYSQL_ROOT_PASSWORD: Insp!ron154
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-pInsp!ron154"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: zan-workorder-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://108.248.232.249:3306/configpage?useSSL=false&serverTimezone=UTC
      DB_USER: zanprduser
      DB_PASSWORD: Insp!ron154
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    image: nginx:alpine
    container_name: zan-workorder-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: zan-workorder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mysql_data:
